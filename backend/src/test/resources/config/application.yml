# Test-only overlay (classpath:/config/ overrides classpath:/application.yml).
# Each Spring test context gets its own in-memory database, so contexts never see each other's
# tables or rows (schema.sql and the ledger loader run once per context).
spring:
  datasource:
    url: jdbc:h2:mem:ledger-test-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
